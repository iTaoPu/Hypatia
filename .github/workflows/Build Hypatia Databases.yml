name: Build Hypatia Databases

on:
  workflow_dispatch:
  schedule:
    - cron: '0 1 */2 * *'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: main
          clean: true
          submodules: false

      - name: Dependency Setup (Java, Maven, ClamAV)
        run: |
          sudo apt-get update -y
          sudo apt install maven openjdk-17-jdk clamav clamav-daemon unzip git dos2unix tree -y
          sudo freshclam || true
          sudo systemctl start clamav-daemon || true

      - name: Organize Directories & Static Sources
        run: |
          mkdir -p "${{ github.workspace }}/raw/"
          mkdir -p "${{ github.workspace }}/exclusions/"
          mkdir -p "${{ github.workspace }}/various/"
          mkdir -p "${{ github.workspace }}/domains/"

          if [ -d "${{ github.workspace }}/static" ]; then
            cp ${{ github.workspace }}/static/* "${{ github.workspace }}/raw/" || true
          fi
      
      - name: DATABASE PREPARATION - ClamAV
        run: |
          mkdir /tmp/mss
          cd /tmp/mss
          if [ -d /var/lib/clamav ]; then
            cp /var/lib/clamav/main.c*d . 2>/dev/null || true
            cp /var/lib/clamav/daily.c*d . 2>/dev/null || true
            sigtool -u main.c*d 2>/dev/null || true
            sigtool -u daily.c*d 2>/dev/null || true
          fi

          mv /tmp/mss/*.fp* "${{ github.workspace }}/exclusions/" || true
          mv /tmp/mss/*.hsb "${{ github.workspace }}/raw/" || true
          mv /tmp/mss/*.hdb "${{ github.workspace }}/raw/" || true
          mv /tmp/mss/*.hdu "${{ github.workspace }}/raw/" || true
          mv /tmp/mss/*.hsu "${{ github.workspace }}/raw/" || true

      - name: DATABASE PREPARATION - ESET
        run: |
          git clone https://github.com/eset/malware-ioc /tmp/eset-sources || true
          if [ -d /tmp/eset-sources ]; then
            processHashes() {
              local name=$(basename $1);
              if [ -f $1/samples.$2 ]; then
                dos2unix $1/samples.$2
                while IFS= read -r line
                do
                  echo "$line" >> "${{ github.workspace }}/various/eset.$2";
                done < "$1/samples.$2";
              fi;
            }
            export -f processHashes;

            find /tmp/eset-sources -maxdepth 2 -mindepth 1 -type d -exec bash -c 'processHashes "{}" md5 hdb' \; || true
            find /tmp/eset-sources -maxdepth 2 -mindepth 1 -type d -exec bash -c 'processHashes "{}" sha1 hsb' \; || true
            find /tmp/eset-sources -maxdepth 2 -mindepth 1 -type d -exec bash -c 'processHashes "{}" sha256 hsb' \; || true
            
            [ -f "${{ github.workspace }}/various/eset.md5" ] && cp "${{ github.workspace }}/various/eset.md5" "${{ github.workspace }}/raw" || true
            [ -f "${{ github.workspace }}/various/eset.sha1" ] && cp "${{ github.workspace }}/various/eset.sha1" "${{ github.workspace }}/raw" || true
            [ -f "${{ github.workspace }}/various/eset.sha256" ] && cp "${{ github.workspace }}/various/eset.sha256" "${{ github.workspace }}/raw" || true
          fi

      - name: DATABASE PREPARATION - Signature-Base
        run: |
          wget https://raw.githubusercontent.com/Neo23x0/signature-base/refs/heads/master/iocs/hash-iocs.txt -O "${{ github.workspace }}/raw/signature-base.loki" || true

      - name: DATABASE PREPARATION - ThreatView
        run: |
          wget "https://threatview.io/Downloads/MD5-HASH-ALL.txt" -O - 2>/dev/null | sed 's/MD5 of //' >> "${{ github.workspace }}/various/threatview.md5" || true
          wget "https://threatview.io/Downloads/SHA-HASH-FEED.txt" -O - 2>/dev/null >> "${{ github.workspace }}/various/threatview.sha1" || true

          sort -u -o "${{ github.workspace }}/raw/threatview.md5" "${{ github.workspace }}/various/threatview.md5" || true
          sort -u -o "${{ github.workspace }}/raw/threatview.sha1" "${{ github.workspace }}/various/threatview.sha1" || true

      - name: DATABASE PREPARATION - ThreatFox
        run: |
          wget "https://threatfox.abuse.ch/export/csv/sha256/full/" -O "${{ github.workspace }}/various/download_threatfox.zip" || true
          if [ -f "${{ github.workspace }}/various/download_threatfox.zip" ]; then
            unzip -o "${{ github.workspace }}/various/download_threatfox.zip" -d "${{ github.workspace }}/various/" || true
            [ -f "${{ github.workspace }}/various/full_sha256.csv" ] && tail -n +10 "${{ github.workspace }}/various/full_sha256.csv" | awk '{ print $4 } ' | sed 's/^"//' | sed 's/",$//' > "${{ github.workspace }}/raw/threatfox.sha256" || true
          fi

      - name: DATABASE PREPARATION - MalwareBazaar
        run: |
          wget "https://bazaar.abuse.ch/export/txt/sha256/full/" -O "${{ github.workspace }}/various/download_bazaar.zip" || true
          if [ -f "${{ github.workspace }}/various/download_bazaar.zip" ]; then
            unzip -o "${{ github.workspace }}/various/download_bazaar.zip" -d "${{ github.workspace }}/various/" || true
            [ -f "${{ github.workspace }}/various/full_sha256.txt" ] && mv "${{ github.workspace }}/various/full_sha256.txt" "${{ github.workspace }}/raw/malware_bazaar.sha256" || true
          fi

      - name: DATABASE PREPARATION - Stalkerware
        run: |
          wget "https://raw.githubusercontent.com/AssoEchap/stalkerware-indicators/refs/heads/master/samples.csv" -O "${{ github.workspace }}/various/stalkerware.csv" || true
          if [ -f "${{ github.workspace }}/various/stalkerware.csv" ]; then
            while IFS=, read -r col1SHA col2Package col3Certificate col4Version col5Name
            do
              if [ -n "$col1SHA" ] && [ -n "$col5Name" ]; then
                echo "$col1SHA:0:$col5Name" >> "${{ github.workspace }}/raw/stalkerware.hsb";
              fi;
            done < "${{ github.workspace }}/various/stalkerware.csv";
            sed -i '1d' "${{ github.workspace }}/raw/stalkerware.hsb" || true
          fi

      - name: DATABASE PREPARATION - Sanesecurity
        run: |
          mkdir -p "${{ github.workspace }}/various/sanesecurity-real/"
          cd "${{ github.workspace }}/various/sanesecurity-real/"

          rsync -av rsync://rsync.sanesecurity.net/sanesecurity . || true

          for f in *.hsb; do
            [ -e "$f" ] || continue
            echo "" >> "${{ github.workspace }}/raw/sanesecurity-$f";
            cat "$f" >> "${{ github.workspace }}/raw/sanesecurity-$f";
            sort -u -o "${{ github.workspace }}/raw/sanesecurity-$f" "${{ github.workspace }}/raw/sanesecurity-$f";
          done

          for f in *.hdb; do
            [ -e "$f" ] || continue
            echo "" >> "${{ github.workspace }}/raw/sanesecurity-$f";
            cat "$f" >> "${{ github.workspace }}/raw/sanesecurity-$f";
            sort -u -o "${{ github.workspace }}/raw/sanesecurity-$f" "${{ github.workspace }}/raw/sanesecurity-$f";
          done

          rm -v ${{ github.workspace }}/raw/sanesecurity-crdfam.clamav.hdb ${{ github.workspace }}/raw/sanesecurity-doppelstern.hdb ${{ github.workspace }}/raw/sanesecurity-malware.expert.hdb 2>/dev/null || true
      
      - name: DATABASE PREPERATION - Avast Covid-19 IOC
        run: |
          git clone https://github.com/avast/covid-19-ioc.git /tmp/covid-19-ioc || true
          if [ -d "/tmp/covid-19-ioc/datasets/android" ]; then
            cd "/tmp/covid-19-ioc/datasets/android"
            tail -n +2 *.csv 2>/dev/null | sed 's/,/ , /' | awk '{ print $1 }' | sort -u >> "${{ github.workspace }}/raw/avast-covid19.sha256" || true
          fi

      - name: DATABASE PREPERATION - Targeted Threats
        run: |
          git clone https://github.com/botherder/targetedthreats.git /tmp/targetedthreats || true
          if [ -d "/tmp/targetedthreats" ]; then
            cd /tmp/targetedthreats
            if [ -f "samples.csv" ]; then
              while IFS=, read -r col1MD5 col2SHA256 col3Family col4Actor col5Country col6Report
              do
                col4Actor=$(sed -e 's/^"//' -e 's/"$//' <<< "$col4Actor");
                col3Family=$(sed -e 's/^"//' -e 's/"$//' <<< "$col3Family");
                if [ -n "$col4Actor" ] && [ -n "$col3Family" ]; then
                    description="$col4Actor-$col3Family";
                elif [ -n "$col4Actor" ] && [ -z "$col3Family" ]; then
                    description="$col4Actor";
                elif [ -z "$col4Actor" ] && [ -n "$col3Family" ]; then
                    description="$col3Family";
                fi;
                if [ -z "$description" ]; then
                    description="targetedthreats";
                fi;
              
                col1MD5=$(sed -e 's/^"//' -e 's/$//' <<< "$col1MD5");
                if [ -n "$col1MD5" ]; then
                    echo "$col1MD5:0:$description" >> ${{ github.workspace }}/raw/targetedthreats.hdb;
                fi;
              
                col2SHA256=$(sed -e 's/^"//' -e 's/$//' <<< "$col2SHA256");
                if [ -n "$col2SHA256" ]; then
                    echo "$col2SHA256:0:$description" >> ${{ github.workspace }}/raw/targetedthreats.hsb;
                fi;
              done < samples.csv;
              sed -i '1d' ${{ github.workspace }}/raw/targetedthreats.hdb || true
              sed -i '1d' ${{ github.workspace }}/raw/targetedthreats.hsb || true
            fi
          fi

      - name: DATABASE PREPARATION - Divest Domains
        run: |
          wget --user-agent="Mozilla/5.0" "https://divested.dev/hosts-domains" -O "${{ github.workspace }}/domains/divested.txt" || true

      - name: GENERATE HYPATIA SIGNATURE DATABASES
        run: |
          mvn clean compile -B --no-transfer-progress
          mvn exec:java -B --no-transfer-progress -Dexec.mainClass="org.maintainteam.hypatiadatabases.App" -Dexec.args="${{ github.workspace }}/raw/ ${{ github.workspace }}/domains/divested.txt ${{ github.workspace }}/exclusions/"
          
          mkdir -p "${{ github.workspace }}/various/"
          echo "Build Success" > "${{ github.workspace }}/various/generation_report.txt"
          echo "<pre>" > "${{ github.workspace }}/various/generation_report.html"
          echo "Hypatia Databases Generated Successfully at $(date -u)" >> "${{ github.workspace }}/various/generation_report.html"
          echo "</pre>" >> "${{ github.workspace }}/various/generation_report.html"

          echo "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}">"${{ github.workspace }}/various/database_generation_ci.txt"

      - name: Move Artifacts, Export gpg.key and Sign
        run: |
          cp -f "${{ github.workspace }}/raw/"hypatia-*.bin "${{ github.workspace }}/" || true
          cp -f "${{ github.workspace }}/various/generation_report.html" "${{ github.workspace }}/" || true
          cp -f "${{ github.workspace }}/various/database_generation_ci.txt" "${{ github.workspace }}/" || true
          
          GEN_TIME=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "$GEN_TIME" > "${{ github.workspace }}/generation_time.html"
          
          if [ -f "${{ github.workspace }}/static/template.html" ]; then
            cp "${{ github.workspace }}/static/template.html" "${{ github.workspace }}/index.html"
            sed -i "s|{{GENERATION_TIME}}|$GEN_TIME|g" "${{ github.workspace }}/index.html"
            sed -i "s|{{CI_BUILD_URL}}|${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|g" "${{ github.workspace }}/index.html"
          fi

          # 自动导入私钥，导出 gpg.key，并对 .bin 文件签名
          if [ -n "${{ secrets.GPG_PRIVATE_KEY }}" ]; then
            echo "Importing GPG Private Key..."
            echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import || true
            
            echo "Exporting public gpg.key..."
            gpg --armor --export > "${{ github.workspace }}/gpg.key"
            
            for bin in ${{ github.workspace }}/hypatia-*.bin; do
              if [ -f "$bin" ]; then
                echo "Signing $bin ..."
                rm -f "$bin.sig"
                gpg --batch --yes --pinentry-mode loopback --passphrase "${{ secrets.GPG_PASSPHRASE }}" --detach-sign "$bin"
              fi
            done
          else
            echo "GPG_PRIVATE_KEY secret is missing, skipping gpg.key export and signing."
          fi

      - name: Commit and Push to main branch
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          cd "${{ github.workspace }}"
          
          git status
          git add hypatia-*.bin hypatia-*.bin.sig gpg.key generation_report.html database_generation_ci.txt index.html generation_time.html 2>/dev/null || true
          
          # 清理临时文件，同时放行 .bin、.sig 和 gpg.key
          git clean -fd -e .github/ -e .git/ -e README.md -e static/ -e raw/ -e exclusions/ -e domains/ -e src/ -e pom.xml -e hypatia-*.bin -e hypatia-*.bin.sig -e gpg.key -e index.html -e generation_report.html -e database_generation_ci.txt -e generation_time.html 2>/dev/null || true
          
          if git diff --staged --quiet && [ -z "$(git status --porcelain)" ]; then
            echo "No changes to commit."
          else
            git add -A
            git commit -m "Auto-update Hypatia databases, GPG signatures and gpg.key [skip ci]"
            git push origin main --force
          fi
